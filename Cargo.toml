[workspace]
resolver = "2"
members = [
    "crates/curd_macro",
    "crates/curd_trait", "crates/print_log_macro", "crates/route_macro"
]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "A simple axum admin template"
authors = ["feihua"]
repository = "https://github.com/feihua/axum-admin"
keywords = ["axum", "admin", "template"]
categories = ["web-programming", "web-programming::http-server"]
license-file = "LICENSE"


[package]
name = "axum-admin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
axum = { version = "0.8.4" }
tokio = { version = "1", features = ["full"] }
axum-valid = "0.25.0"
validator = { version = "0.20.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }

rbs = { version = "4" }
rbatis = { version = "4.0", features = ["debug_mode"] }
rbdc-mysql = { version = "4" }
rbdc-pool-fast = { version = "4" }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["local-time", "chrono"] }
tracing-appender = "0.2.3"

jsonwebtoken = { version = "11.0.0", features = ["rust_crypto"] }

redis = "1.3.0"

thiserror = "2.0.3"
regex = "1.11.1"
config = "0.15.9"
chrono = "0.4.38"

curd_trait = "0.1.2"
curd_macro = "0.1.2"
print_log_macro = { path = "crates/print_log_macro" }
route_macro = { path = "crates/route_macro" }
